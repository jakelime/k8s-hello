stages:
  - Trigger

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never 
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

src-django:
  stage: Trigger
  trigger:
    include: src-django/.gitlab-ci.yml
    strategy: depend
    forward:
      pipeline_variables: true
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
      - src-django/**/*

src-mgdb:
  stage: Trigger
  trigger:
    include: src-mgdb/.gitlab-ci.yml
    strategy: depend
    forward:
      pipeline_variables: true
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
      - src-mgdb/**/*

src-valkey:
  stage: Trigger
  trigger:
    include: src-valkey/.gitlab-ci.yml
    strategy: depend
    forward:
      pipeline_variables: true
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
      - src-valkey/**/*
