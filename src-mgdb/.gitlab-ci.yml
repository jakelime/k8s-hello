variables:
  PROJECT_IMAGE_NAME: src-mgdb
  APP_NAME: src-mgdb
  DOCKERFILE_PATH: src-mgdb/Dockerfile
  DOCKERFILE_CONTEXT_DIR: src-mgdb
  VERSION_FILE_DIR: src-mgdb
  HELM_VALUE_DIR: "src-mgdb"

include:
  - project: 'devsecops-platform/master-templates'
    ref: feature/dotnet-lib
    file: 'ci/ci-template-microservices.gitlab-ci.yml'
    rules:
      - if: '$CI_COMMIT_BRANCH != "master"'

  - project: 'devsecops-platform/master-templates'
    ref: feature/dotnet-lib
    file: 'cd/cd-template-microservices-non-prd.gitlab-ci.yml'
    inputs: 
      runner: "agent-CAEngineSvcEnvis-DEV"
    rules:
      - if: '$CI_COMMIT_BRANCH == "develop"'

  - project: 'devsecops-platform/master-templates'
    ref: feature/dotnet-lib
    file: 'cd/cd-template-microservices-non-prd.gitlab-ci.yml'
    inputs: 
      runner: "agent-CAEngineSvcEnvis-DEV"
    rules:
      - if: '$CI_COMMIT_REF_NAME =~ /^release\/.*$/'
      - if: '$CI_COMMIT_REF_NAME =~ /^hotfix\/.*$/'

  - project: 'devsecops-platform/master-templates'
    ref: feature/dotnet-lib
    file: 'cd/cd-template-microservices.gitlab-ci.yml'
    inputs: 
      runner: "agent-CAEngineSvcEnvis-DEV"
    rules:
      - if: '$CI_COMMIT_BRANCH == "master"'

